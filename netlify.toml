# Netlify 배포 설정
#
# [구성]
#  · 프론트엔드: 정적 배포 (Vite → dist). Netlify 정적 호스팅을 그대로 유지합니다.
#  · 백엔드: /api/* 경로만 Netlify Functions 로 연결합니다.
#    저장소는 Netlify Blobs (별도 DB 서버 불필요).
#
#  이렇게 하는 이유
#   - 관리자가 고친 내용이 "모든 방문자"에게 보이려면 서버 저장이 필요합니다.
#   - 그렇다고 Node 서버 호스팅으로 옮기면 지금의 Netlify 배포 방식을 버려야 합니다.
#   - Netlify Functions + Blobs 는 정적 배포를 유지한 채로 그 두 가지만 해결합니다.
#
# [주의] 예전에는 VITE_STATIC_SITE=1 (build:static) 로 빌드해 /api 요청을 아예 막았습니다.
#        이제 /api 가 실제로 동작하므로 기본 빌드(`npm run build`)를 사용합니다.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── API 라우팅 ────────────────────────────────────────────────────────────
# SPA fallback(/*) 보다 반드시 위에 있어야 합니다. Netlify 는 위에서부터 매칭합니다.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# ── SPA 라우팅 ────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# 해시가 포함된 번들은 영구 캐시
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
